[workspace]
resolver = "3"
members = [
    "crates/elasticctl-core",
    "crates/elasticctl-api",
    "crates/elasticctl-cli",
    "crates/elasticctl-api/tests/support",
    "xtask",
]

[workspace.package]
version = "0.6.0"
edition = "2024"
rust-version = "1.97.1"
license = "Apache-2.0"
repository = "https://github.com/dannyota/elasticctl"
authors = ["Danny"]

[workspace.dependencies]
elasticctl-core = { path = "crates/elasticctl-core", version = "0.6.0" }
elasticctl-api = { path = "crates/elasticctl-api", version = "0.6.0" }
# Test-only; `publish = false`, referenced by path alone so `cargo publish`
# omits this dev-dependency from published manifests instead of keeping a
# version that is not on crates.io.
elasticctl-api-test-support = { path = "crates/elasticctl-api/tests/support" }
# Declare this once so every crate uses the same map semantics. Insertion order
# drives table and CSV columns; alphabetical order would change field order.
serde_json = { version = "1.0.151", features = ["preserve_order"] }
semver = "1.0.28"

# Profile used by `dist`.
[profile.dist]
inherits = "release"
lto = "thin"

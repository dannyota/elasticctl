[workspace]
resolver = "3"
members = [
    "crates/elasticctl-core",
    "crates/elasticctl-api",
    "crates/elasticctl-mcp",
    "crates/elasticctl-cli",
    "crates/elasticctl-api/tests/support",
    "xtask",
]

[workspace.package]
version = "0.9.3"
edition = "2024"
rust-version = "1.97.1"
license = "Apache-2.0"
repository = "https://github.com/dannyota/elasticctl"
authors = ["Danny"]

[workspace.dependencies]
elasticctl-core = { path = "crates/elasticctl-core", version = "0.9.3" }
elasticctl-api = { path = "crates/elasticctl-api", version = "0.9.3" }
elasticctl-mcp = { path = "crates/elasticctl-mcp", version = "0.9.3" }
elasticctl-api-test-support = { path = "crates/elasticctl-api/tests/support" }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
semver = "1.0.28"

[profile.dist]
inherits = "release"
lto = "thin"

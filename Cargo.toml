[workspace]
resolver = "3"
members = ["crates/elasticctl-core", "crates/elasticctl-api", "crates/elasticctl-cli", "xtask"]

[workspace.package]
version = "0.1.3"
edition = "2024"
rust-version = "1.97.1"
license = "Apache-2.0"
repository = "https://github.com/dannyota/elasticctl"
authors = ["Danny"]

[workspace.dependencies]
elasticctl-core = { path = "crates/elasticctl-core", version = "0.1.3" }
elasticctl-api = { path = "crates/elasticctl-api", version = "0.1.3" }
# Declare this once so every crate uses the same map semantics. Insertion order
# drives table and CSV columns; alphabetical order would change field order.
serde_json = { version = "1.0.151", features = ["preserve_order"] }

# Profile used by `dist`.
[profile.dist]
inherits = "release"
lto = "thin"

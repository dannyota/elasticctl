[workspace]
members = ["cargo:."]

# Configuration for `dist`.
#
# NOTE: .github/workflows/release.yml adds manual edits to generator output:
# workflow `contents: read`, `write` only for `host`, and no `pull_request`
# trigger. `allow-dirty = ["ci"]` makes dist skip CI mode, preserving those
# edits. An explicit `dist generate --mode=ci` fails instead of overwriting
# them. To regenerate the workflow, remove `allow-dirty` first, then reapply
# the permission edits.
[dist]
# Preferred dist version for CI (Cargo.toml SemVer syntax).
cargo-dist-version = "0.32.0"
# CI backend to generate.
ci = "github"
# Allow the hand-edited release.yml to differ from generator output.
allow-dirty = ["ci"]
# Installers to generate for each app.
installers = ["shell", "powershell"]
# Target platforms to build (Rust target-triple syntax).
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "aarch64-unknown-linux-musl", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl", "x86_64-pc-windows-msvc"]

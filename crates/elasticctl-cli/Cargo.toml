[package]
name = "elasticctl-cli"
publish = true
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Operate Elastic Security as code with a safety-first CLI for security engineers."

[[bin]]
name = "elasticctl"
path = "src/main.rs"

[dependencies]
elasticctl-core.workspace = true
elasticctl-api.workspace = true
clap = { version = "4.6.6", features = ["derive"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json.workspace = true
serde_yaml_ng = "0.10.0"
clap_complete = "4.6.9"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["full"] }
wiremock = "0.6.5"

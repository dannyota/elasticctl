[package]
name = "elasticctl-mcp"
publish = true
exclude = ["tests/**"]
description = "MCP server runtime for Elastic Security rule operations."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
elasticctl-api.workspace = true
elasticctl-core.workspace = true
rmcp = { version = "=3.2.0", default-features = false, features = ["server", "macros", "transport-io"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json.workspace = true
tokio = { version = "1.53.1", features = ["io-util", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = "0.7.18"
tracing = "0.1.44"
url = "=2.5.8"

[dev-dependencies]
elasticctl-api-test-support.workspace = true
rmcp = { version = "=3.2.0", default-features = false, features = ["client", "transport-io"] }
tokio = { version = "1.53.1", features = ["full", "test-util"] }
wiremock = "0.6.5"

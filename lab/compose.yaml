services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.1
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=true
      - ELASTIC_PASSWORD=elasticctl-lab
      - ES_JAVA_OPTS=-Xms2g -Xmx2g
      - xpack.security.http.ssl.enabled=false
    ports: ["9200:9200"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -u elastic:elasticctl-lab http://localhost:9200/_cluster/health | grep -qE 'green|yellow'"]
      interval: 10s
      retries: 30

  kibana:
    image: docker.elastic.co/kibana/kibana:9.5.1
    depends_on:
      elasticsearch: {condition: service_healthy}
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=kibana_system
      - ELASTICSEARCH_PASSWORD=elasticctl-lab-kibana
      # The alerting framework needs this key to persist rule API keys. Without
      # it, every rule creation fails with an error that does not mention
      # encryption. The Docker entrypoint maps only the `UPPER_SNAKE` form to a
      # long option; it silently ignores the dotted form.
      - XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY=elasticctl_lab_encryption_key_32ch
      - XPACK_SECURITY_ENCRYPTIONKEY=elasticctl_lab_security_key_32chars
      - XPACK_REPORTING_ENCRYPTIONKEY=elasticctl_lab_reporting_key_32chr
    ports: ["5601:5601"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5601/api/status | grep -q available"]
      interval: 10s
      retries: 40

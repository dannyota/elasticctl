
[advisories]
yanked = "deny"
unmaintained = "workspace"

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
skip = [
    { crate = "base64@0.22.1", reason = "reqwest 0.13.4 still requires base64 0.22 while elasticctl uses current base64 0.23" },
    { crate = "getrandom@0.2.17", reason = "directories 6 reaches getrandom 0.2 through its Redox support while current build dependencies use 0.4" },
    { crate = "syn@2.0.119", reason = "reqwest platform support and ICU derives still require syn 2 while current derive crates use syn 3" },
    { crate = "windows-sys@0.52.0", reason = "rustix and reqwest platform support still require windows-sys 0.52 while current Tokio and CLI crates use 0.61" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

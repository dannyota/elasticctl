# cargo-deny checks what the dependency tree carries.
#
# `cargo test` checks our code; this checks its dependencies. The tree reaches
# about 240 crates through reqwest, tokio, and serde. Advisories can affect an
# unchanged tree, so CI runs this on a schedule and on every push.

[advisories]
# RustSec vulnerabilities always fail. cargo-deny 0.20 removed the option to
# warn instead. Apply `unmaintained` only to direct dependencies: an unmaintained
# transitive crate is a signal, but not a reason to block a release.
yanked = "deny"
unmaintained = "workspace"

[licenses]
# The binary is Apache-2.0. Allow the permissive licenses used by this Rust
# dependency tree; anything else requires an explicit decision.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    # option-ext is reached through directories -> dirs-sys and is available
    # under no other license in the tree. MPL-2.0 is file-level copyleft, so
    # linking it into this Apache-2.0 binary is allowed; only changes to those
    # files must be published. We vendor and modify nothing, so allow it here
    # instead of widening the list.
    "MPL-2.0",
]
confidence-threshold = 0.9

[bans]
# Two versions of a crate usually indicate transitive lag, so warn. A wildcard
# dependency is a supply-chain risk because it accepts the next registry value.
multiple-versions = "warn"
wildcards = "deny"
# The unpublished test-support crate is a path-only dev dependency. Keep
# registry wildcards denied while allowing that internal workspace edge to
# remain versionless so Cargo omits it from published manifests.
allow-wildcard-paths = true

[sources]
# Allow only crates.io. A git or private-registry dependency requires an
# explicit decision.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

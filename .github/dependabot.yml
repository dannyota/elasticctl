version: 2
updates:
  # Keep the dependency tree close enough to upgrade without a separate project.
  # The audit job handles security advisories on its own weekly schedule.
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Group routine patch and minor bumps into one PR to avoid noise.
      minor-and-patch:
        update-types: ["minor", "patch"]

  # Check pinned action versions before they become release-path failures.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly

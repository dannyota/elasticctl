name: CI
on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # Run weekly on Sunday at 03:00 UTC. Advisories can affect an unchanged
    # dependency tree, so the audit job needs its own schedule.
    - cron: "0 3 * * 0"
  workflow_dispatch:

# A new push to a pull request cancels its older run. Other events group by
# commit, so a newer master push never cancels a pending master run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  lengths:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: bash scripts/test/check-lengths-test.sh
      # The shim needs Bash 4.4 or newer; the macOS runner ships Bash 3.2.
      - if: runner.os == 'Linux'
        run: bash scripts/test/mcp-stdio-shim-test.sh
      - name: Check file lengths
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            bash scripts/check-lengths.sh --base-ref "origin/$BASE_REF"
          else
            bash scripts/check-lengths.sh
          fi

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select pinned Rust compiler
        shell: bash
        run: |
          version="$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)"
          test -n "$version"
          rustup toolchain install "$version" --profile minimal --component rustfmt,clippy
          echo "RUSTUP_TOOLCHAIN=$version" >> "$GITHUB_ENV"
          test "$(rustc +"$version" --version | cut -d ' ' -f 2)" = "$version"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - run: cargo fmt --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - uses: taiki-e/install-action@682ce6c3c696a4cd5168a05f98e51aa02b877941 # v2.89.1
        with:
          tool: cargo-nextest@0.9.114
      - run: cargo nextest run --locked --no-fail-fast --workspace
      - run: cargo test --locked --workspace --doc
      - run: ./scripts/check-packages.sh

  # macOS, Windows, and the declared toolchain wait for the Linux test job, so a
  # failing change does not hold the scarcer runners.
  test-macos:
    needs: test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select pinned Rust compiler
        shell: bash
        run: |
          version="$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)"
          test -n "$version"
          rustup toolchain install "$version" --profile minimal --component rustfmt,clippy
          echo "RUSTUP_TOOLCHAIN=$version" >> "$GITHUB_ENV"
          test "$(rustc +"$version" --version | cut -d ' ' -f 2)" = "$version"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - uses: taiki-e/install-action@682ce6c3c696a4cd5168a05f98e51aa02b877941 # v2.89.1
        with:
          tool: cargo-nextest@0.9.114
      - run: cargo nextest run --locked --no-fail-fast --workspace
      - run: cargo test --locked --workspace --doc

  declared-rust:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read declared Rust version
        id: rust_version
        shell: bash
        run: |
          version="$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)"
          test -n "$version"
          test "$(printf '%s\n' "$version" | wc -l)" -eq 1
          echo "version=$version" >> "$GITHUB_OUTPUT"
          primary="$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)"
          test -n "$primary"
          echo "primary=$primary" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        if: steps.rust_version.outputs.version != steps.rust_version.outputs.primary
        with:
          toolchain: ${{ steps.rust_version.outputs.version }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: steps.rust_version.outputs.version != steps.rust_version.outputs.primary
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - run: cargo check --locked --workspace --all-targets
        if: steps.rust_version.outputs.version != steps.rust_version.outputs.primary

  transaction-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select pinned Rust compiler
        shell: bash
        run: |
          version="$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)"
          test -n "$version"
          rustup toolchain install "$version" --profile minimal --component rustfmt,clippy
          echo "RUSTUP_TOOLCHAIN=$version" >> "$GITHUB_ENV"
          test "$(rustc +"$version" --version | cut -d ' ' -f 2)" = "$version"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - uses: taiki-e/install-action@682ce6c3c696a4cd5168a05f98e51aa02b877941 # v2.89.1
        with:
          tool: cargo-nextest@0.9.114
      - run: cargo nextest run --locked --no-fail-fast -p elasticctl-api -p elasticctl -E 'package(=elasticctl) | (package(=elasticctl-api) & (binary(=state) | test(transaction)))'

  # Check advisories, licences, duplicate versions, and unvetted sources from
  # deny.toml.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories bans licenses sources

  # Check recorded fixtures for credentials and project identity. A generic
  # secret scanner misses a project hostname in `kibana.alert.url` because it is
  # identity in a value, not a credential in a key.
  fixture-leak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash scripts/test/check-fixtures-test.sh
      - name: Scan recorded fixtures for identity and credentials
        run: ./scripts/check-fixtures.sh
      - name: Validate public conformance reports
        run: ./scripts/check-conformance-reports.sh

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # install-action has no gitleaks support, so fetch the pinned release and
      # check it against the SHA-256 published in gitleaks_8.30.1_checksums.txt.
      - name: Install gitleaks 8.30.1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v8.30.1 -R gitleaks/gitleaks -p gitleaks_8.30.1_linux_x64.tar.gz -D "$RUNNER_TEMP"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks_8.30.1_linux_x64.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/gitleaks_8.30.1_linux_x64.tar.gz" -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      # Include merge diffs: plain `git log -p --all` omits a secret added while
      # resolving a merge.
      - run: gitleaks git --log-opts="--all --full-history --diff-merges=separate" --redact

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # install-action has no actionlint support, so fetch the pinned release
      # and check it against the SHA-256 in actionlint_1.7.12_checksums.txt.
      - name: Install actionlint 1.7.12
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v1.7.12 -R rhysd/actionlint -p actionlint_1.7.12_linux_amd64.tar.gz -D "$RUNNER_TEMP"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint_1.7.12_linux_amd64.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/actionlint_1.7.12_linux_amd64.tar.gz" -C "$RUNNER_TEMP" actionlint
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - run: actionlint .github/workflows/*.yml

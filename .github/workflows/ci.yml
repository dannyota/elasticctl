name: CI
on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # Weekly, Sunday 03:00 UTC. Advisories land against a dependency tree that
    # has not changed, so the audit job needs a clock of its own — a repo with
    # no commits this week is exactly the one nobody has checked.
    - cron: "0 3 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  # Software composition: what the 240-odd transitive crates carry with them.
  # Advisories, licences, and duplicate/unvetted sources, all from deny.toml.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources

  # Fixtures are recorded from a live stack and committed to a public repo.
  # A generic secret scanner does not catch what actually leaked here: a
  # project hostname under `kibana.alert.url`, which is identity in a value
  # rather than a credential in a key. This checks the shapes that matter.
  fixture-leak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan recorded fixtures for identity and credentials
        run: ./scripts/check-fixtures.sh

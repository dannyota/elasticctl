name: CI
on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # Weekly, Sunday 03:00 UTC. The live job only runs on schedule and on
    # manual dispatch; the offline test job runs on every event.
    - cron: "0 3 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  live:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # `./lab/up.sh` uses `podman compose`, which delegates to a docker-compose
      # provider. The lab is self-contained: its credentials are throwaway
      # local values and its API key is generated here at runtime, so no
      # GitHub secret is needed.
      - name: Install podman and a compose provider
        run: |
          sudo apt-get update
          sudo apt-get install -y podman docker-compose-v2
      - name: Start the local lab
        run: ./lab/up.sh
      - name: Point the live suite at the lab
        run: |
          KEY=$(curl -sf -u elastic:elasticctl-lab -X POST http://localhost:9200/_security/api_key \
            -H 'Content-Type: application/json' \
            -d '{"name":"elasticctl-ci"}' \
            | python3 -c 'import json,sys;print(json.load(sys.stdin)["encoded"])')
          echo "ELASTICCTL_KIBANA_URL=http://localhost:5601" >> "$GITHUB_ENV"
          echo "ELASTICCTL_ES_URL=http://localhost:9200" >> "$GITHUB_ENV"
          echo "ELASTICCTL_API_KEY=$KEY" >> "$GITHUB_ENV"
      # Seed prebuilt rules so the pull/diff test runs against real data
      # rather than an empty stack, where a clean diff is vacuous.
      - name: Install prebuilt rules
        run: cargo xtask seed
      - name: Run the live conformance suite
        run: ELASTICCTL_LIVE=1 cargo test --workspace -- --ignored
      - name: Tear down the lab
        if: always()
        run: ./lab/down.sh

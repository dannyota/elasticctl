name: CI
on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # Run weekly on Sunday at 03:00 UTC. Advisories can affect an unchanged
    # dependency tree, so the audit job needs its own schedule.
    - cron: "0 3 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - run: ./scripts/check-packages.sh

  declared-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Read declared Rust version
        id: rust_version
        shell: bash
        run: |
          version="$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)"
          test -n "$version"
          test "$(printf '%s\n' "$version" | wc -l)" -eq 1
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.rust_version.outputs.version }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked --workspace --all-targets

  transaction-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked -p elasticctl-api --test state
      - run: cargo test --locked -p elasticctl-api transaction
      - run: cargo test --locked -p elasticctl --bin elasticctl report_file

  # Check advisories, licences, duplicate versions, and unvetted sources from
  # deny.toml.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources

  # Check recorded fixtures for credentials and project identity. A generic
  # secret scanner misses a project hostname in `kibana.alert.url` because it is
  # identity in a value, not a credential in a key.
  fixture-leak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Scan recorded fixtures for identity and credentials
        run: ./scripts/check-fixtures.sh

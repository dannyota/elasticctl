name: Publish crates

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Released tag to publish, for example v0.6.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-crates
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      commit: ${{ steps.commit.outputs.sha }}
    steps:
      - name: Require a release-shaped tag
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
            echo "tag must look like v1.2.3 or v1.2.3-rc.1" >&2
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false

      - name: Record the tagged commit
        id: commit
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Require every workspace version field to match the tag
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          python3 - "$TAG" <<'PY'
          import sys, tomllib
          tag = sys.argv[1]
          want = tag[1:]
          with open("Cargo.toml", "rb") as f:
              root = tomllib.load(f)
          fields = {"[workspace.package] version": root["workspace"]["package"]["version"]}
          for name in ("elasticctl-core", "elasticctl-api", "elasticctl-mcp"):
              fields[f"[workspace.dependencies] {name}"] = root["workspace"]["dependencies"][name]["version"]
          for name, directory in (
              ("elasticctl-core", "elasticctl-core"),
              ("elasticctl-api", "elasticctl-api"),
              ("elasticctl-mcp", "elasticctl-mcp"),
              ("elasticctl", "elasticctl-cli"),
          ):
              with open(f"crates/{directory}/Cargo.toml", "rb") as f:
                  version = tomllib.load(f)["package"]["version"]
              fields[f"package {name}"] = root["workspace"]["package"]["version"] if version == {"workspace": True} else version
          wrong = {k: v for k, v in fields.items() if v != want}
          for k, v in wrong.items():
              print(f"{k} is {v}, tag is {tag}", file=sys.stderr)
          if wrong:
              sys.exit(1)
          print(f"all {len(fields)} version fields equal {want}")
          PY

      - name: Require a complete GitHub Release for the tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          COMMIT: ${{ steps.commit.outputs.sha }}
        run: |
          release="$(gh release view "$TAG" --json isDraft,targetCommitish,assets 2>/dev/null || true)"
          if [ -z "$release" ] || [ "$(jq -r .isDraft <<<"$release")" != "false" ]; then
            echo "release $TAG is missing or still a draft" >&2
            exit 1
          fi
          built_from="$(jq -r .targetCommitish <<<"$release")"
          if [[ "$built_from" =~ ^[0-9a-f]{40}$ ]] && [ "$built_from" != "$COMMIT" ]; then
            echo "release $TAG was built from $built_from but the tag now points at $COMMIT" >&2
            exit 1
          fi
          mapfile -t assets < <(jq -r '.assets[] | select(.state == "uploaded") | .name' <<<"$release")
          expected=(dist-manifest.json sha256.sum source.tar.gz source.tar.gz.sha256
            elasticctl-installer.sh elasticctl-installer.ps1)
          targets="$(sed -n 's/^targets = \[\(.*\)\]/\1/p' dist-workspace.toml | tr -d '",')"
          if [ -z "$targets" ]; then
            echo "no targets parsed from dist-workspace.toml; the array must be on one line" >&2
            exit 1
          fi
          for target in $targets; do
            case "$target" in
              *-windows-*) archive="elasticctl-$target.zip" ;;
              *) archive="elasticctl-$target.tar.xz" ;;
            esac
            expected+=("$archive" "$archive.sha256")
          done
          if [ "${#expected[@]}" -lt 8 ]; then
            echo "expected asset list is implausibly short (${#expected[@]})" >&2
            exit 1
          fi
          missing=()
          for name in "${expected[@]}"; do
            printf '%s\n' "${assets[@]}" | grep -qxF -- "$name" || missing+=("$name")
          done
          if [ "${#missing[@]}" -ne 0 ]; then
            echo "release $TAG is missing assets: ${missing[*]}" >&2
            exit 1
          fi
          echo "release $TAG carries all ${#expected[@]} expected assets"

      - name: Require crates.io package ownership
        shell: bash
        run: ./scripts/check-crates-io-publish-ready.sh

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Verify the packages before uploading anything
        shell: bash
        run: cargo publish --workspace --dry-run --locked --registry crates-io

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false

      - name: Require the commit the verify job checked
        shell: bash
        env:
          EXPECTED: ${{ needs.verify.outputs.commit }}
        run: |
          actual="$(git rev-parse HEAD)"
          if [ -z "$EXPECTED" ] || [ "$actual" != "$EXPECTED" ]; then
            echo "tag moved between verify ($EXPECTED) and publish ($actual)" >&2
            exit 1
          fi

      - name: Require crates.io package ownership
        shell: bash
        run: ./scripts/check-crates-io-publish-ready.sh

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: auth

      - name: Publish all four crates together
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --workspace --locked --registry crates-io
